name: Draft v1.0.0 release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: draft-v1.0.0
  cancel-in-progress: false
jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v1.0.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        run: node -e "if(require('./package.json').version !== '1.0.0') process.exit(1)"
      - run: npm ci
      - run: npm run check
      - name: Check downloaded Electron runtime
        run: node -e "const fs=require('fs'),cp=require('child_process'),p=require('electron');console.log('Electron path:',p,'bytes:',fs.statSync(p).size);const r=cp.spawnSync(p,['--version'],{encoding:'utf8',timeout:15000});console.log('Exit:',r.status,'stdout:',r.stdout,'stderr:',r.stderr,'error:',r.error?.message)"
      - run: npm test
        env:
          DEBUG: 'pw:browser'
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:packaged
        env:
          DEBUG: 'pw:browser'
      - name: Generate checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap' }
          if (-not ($assets | Where-Object Extension -eq '.exe')) { throw 'Installer not found' }
          $assets | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: v1.0.0-Windows-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
      - name: Create draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release create v1.0.0 @assets --verify-tag --draft --title 'KML Transit Journey v1.0.0' --notes-file docs/releases/v1.0.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; inspect existing release before retrying. No public release was requested.' }
